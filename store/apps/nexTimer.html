<!doctype html><html><body style="margin:0;min-height:100vh;background:radial-gradient(circle at top,#263b6b,#080a10 65%);color:white;font:16px system-ui;display:grid;place-items:center;text-align:center"><main><div style="font-size:72px;font-weight:700" id="t">01:00</div><input id="s" type="number" min="1" value="60" style="padding:10px;border-radius:10px;border:0"><button id="go" style="padding:10px;border:0;border-radius:10px">Start</button></main><script>let q=0;go.onclick=()=>{clearInterval(q);let n=Math.max(1,+s.value||60);t.textContent='00:'+String(n).padStart(2,'0');q=setInterval(()=>{n--;t.textContent=Math.floor(n/60).toString().padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n<=0)clearInterval(q)},1000)}</script></body></html>
