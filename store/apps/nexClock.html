<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:radial-gradient(circle at top,#263b6b,#080a10 65%);color:white;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.clock{text-align:center}.t{font-size:64px;font-weight:700;letter-spacing:-3px}.d{opacity:.65}</style></head><body><div class="clock"><div class="t" id="t"></div><div class="d" id="d"></div></div><script>function tick(){const x=new Date();document.getElementById('t').textContent=x.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});document.getElementById('d').textContent=x.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}tick();setInterval(tick,1000)</script></body></html>
